# Recording rules: the neutral `llm:*` aliases the ADR (workspace-szw.1) promises
# as the place vendor name-drift is absorbed.
#
# These exist so hand-written queries, the provisioned dashboard and future alert
# rules can say `llm:decode_tokens_per_second` instead of guessing between
# `llamacpp:*`, `halogen:*`, `llama:*` and `vllm:*` once more than one serving
# stack is on the box. They are written every evaluation, so a new series appears
# in the TSDB within ~one interval of its source counter being first scraped.
#
# The provisioned dashboard does NOT depend on them: its panels spell the raw
# expressions and plot these aliases *beside* them, so it renders against a server
# whose rules have never run and "No data" means no data, not no rule (see
# monitoring/README.md "Recording rules vs raw PromQL in panels"). Where an alias
# is drawn on a panel, `check_monitoring.py` verifies the name is actually recorded
# here — a typo'd alias is invisible until someone trusts it.
#
# LABELS: every alias keeps `job`, `instance` and the normalized `model` rather than
# collapsing to one global number. A dimensionless global sum cannot be filtered by
# the dashboard's $instance / $model variables, and a panel that silently ignores
# its own filters is worse than no panel; the ADR's contract is the alias *names*,
# explicitly not their label set (and the alert rules that read raw names are
# unaffected). `model` is normalized the same way the dashboard does it: vLLM's
# `model_name` copied onto `model` with the regex `(.+)`, not `(.*)` — an empty
# `model_name` matches `(.*)` on the empty string and would blank a perfectly good
# `model` label that file_sd set. Verified against a live Prometheus.
#
# Not generated; no thresholds involved. Committed and validated by
# `promtool check rules monitoring/prometheus/recording_rules.yml`.
#
# Four groups live here now:
#   `llm-aliases`       the 5 m vendor-neutral aliases ADR 0001 C3 names;
#   `llm-scrape-health` whether the monitor is actually scraping;
#   `llm-rollups`       those same measurements folded over an hour, a day and a
#                       week — the series the dashboard's History row reads (amd-frx);
#   `host-baselines`    the box's own GTT / PSI / temperature maxima (workspace-szw.13).
#
# The metric-name unions below must stay in step with the selector constants in
# monitoring/grafana/make_dashboard.py (DECODE_TOKENS, CACHE_CACHED, ...). Both
# sides are one edit each; if they ever drift, the `(rule)` series on a panel will
# disagree with the raw series next to it.

groups:
  - name: llm-aliases
    interval: 30s
    rules:
      # Generation throughput, windowed — the correct version of the server's own
      # "average since last scrape" gauge llamacpp:predicted_tokens_seconds.
      # The {__name__=~...} selector is the vendor-drift seam: add the next stack's
      # counter name here once, not in every panel and alert.
      - record: llm:decode_tokens_per_second
        expr: >-
          sum by (job, instance, model) (label_replace(rate({__name__=~"llamacpp:tokens_predicted_total|llamacpp:predicted_tokens_total|vllm:generation_tokens_total"}[5m]), "model", "$1", "model_name", "(.+)"))

      - record: llm:prompt_tokens_per_second
        expr: >-
          sum by (job, instance, model) (label_replace(rate({__name__=~"llamacpp:prompt_tokens_total|vllm:prompt_tokens_total"}[5m]), "model", "$1", "model_name", "(.+)"))

      - record: llm:requests_per_second
        expr: >-
          sum by (job, instance, model) (label_replace(rate({__name__=~"halogen:requests_total|llamacpp:requests_total|vllm:request_success_total"}[5m]), "model", "$1", "model_name", "(.+)"))

      # Queue depth as a gauge pair, so an alert can say "queued" instead of naming
      # a vendor. These two were listed as pending in ADR 0001 C3 and are what
      # workspace-szw.5's queueing alerts should read.
      - record: llm:requests_running
        expr: >-
          sum by (job, instance, model) (label_replace({__name__=~"llamacpp:requests_processing|vllm:num_requests_running"}, "model", "$1", "model_name", "(.+)"))

      - record: llm:requests_queued
        expr: >-
          sum by (job, instance, model) (label_replace({__name__=~"llamacpp:requests_deferred|vllm:num_requests_waiting"}, "model", "$1", "model_name", "(.+)"))

      # Prompt-cache hit ratio over 5m. The `+ cached` in the denominator is the
      # llama.cpp convention: prompt_tokens_total counts only the tokens that
      # MISSED the cache. clamp_min keeps a quiet server's 0/0 from becoming a NaN
      # hole (Prometheus drops NaN, which reads as a missing metric).
      - record: llm:prompt_cache_hit_ratio
        expr: >-
          sum by (job, instance, model) (label_replace(rate({__name__=~"halogen:prompt_tokens_cached_total|llamacpp:prompt_cache_tokens_cached_total"}[5m]), "model", "$1", "model_name", "(.+)"))
          /
          clamp_min(sum by (job, instance, model) (label_replace(rate({__name__=~"llamacpp:prompt_tokens_total|vllm:prompt_tokens_total"}[5m]), "model", "$1", "model_name", "(.+)")) + sum by (job, instance, model) (label_replace(rate({__name__=~"halogen:prompt_tokens_cached_total|llamacpp:prompt_cache_tokens_cached_total"}[5m]), "model", "$1", "model_name", "(.+)")), 1)

      # Speculative-decode acceptance over 5m. clamp_min kills the 0/0 -> NaN spike
      # a restart (or an idle minute) leaves behind.
      - record: llm:draft_acceptance_ratio
        expr: >-
          sum by (job, instance, model) (label_replace(rate({__name__=~"halogen:draft_tokens_accepted_total|llamacpp:draft_tokens_accepted_total"}[5m]), "model", "$1", "model_name", "(.+)"))
          /
          clamp_min(sum by (job, instance, model) (label_replace(rate({__name__=~"halogen:draft_tokens_total|llamacpp:draft_tokens_total"}[5m]), "model", "$1", "model_name", "(.+)")), 1)

      - record: llm:kv_cache_usage_ratio
        expr: >-
          max by (job, instance, model) (label_replace({__name__=~"llamacpp:kv_cache_usage_ratio|llamacpp:kv_cache_usage"}, "model", "$1", "model_name", "(.+)"))

      # ------------------------------------------------------------------ #
      # Latency quantiles (ADR 0001 C3, deferred to the dashboard ticket).
      #
      # `sum by (le, ...)` first, then histogram_quantile: quantiles of per-series
      # quantiles are meaningless, and `le` has to survive the aggregation because
      # it is what the quantile function reads. `le` is deliberately NOT kept on the
      # output (histogram_quantile drops it), so these are ordinary series and not
      # half a histogram.
      #
      # These only produce series where the server publishes `_bucket` series.
      # A build with counters and average gauges only — which is what most
      # llama.cpp builds do — emits nothing here, and the dashboard's "no histogram
      # on this server" message is the honest answer, not a gap to fill.
      # ------------------------------------------------------------------ #
      - record: llm:time_to_first_token_seconds:p50
        expr: >-
          histogram_quantile(0.50, sum by (le, job, instance, model) (label_replace(rate({__name__=~"llama:time_to_first_token_seconds_bucket|llamacpp:time_to_first_token_seconds_bucket|llamacpp:ttft_seconds_bucket|vllm:time_to_first_token_seconds_bucket"}[5m]), "model", "$1", "model_name", "(.+)")))

      - record: llm:time_to_first_token_seconds:p90
        expr: >-
          histogram_quantile(0.90, sum by (le, job, instance, model) (label_replace(rate({__name__=~"llama:time_to_first_token_seconds_bucket|llamacpp:time_to_first_token_seconds_bucket|llamacpp:ttft_seconds_bucket|vllm:time_to_first_token_seconds_bucket"}[5m]), "model", "$1", "model_name", "(.+)")))

      - record: llm:time_to_first_token_seconds:p99
        expr: >-
          histogram_quantile(0.99, sum by (le, job, instance, model) (label_replace(rate({__name__=~"llama:time_to_first_token_seconds_bucket|llamacpp:time_to_first_token_seconds_bucket|llamacpp:ttft_seconds_bucket|vllm:time_to_first_token_seconds_bucket"}[5m]), "model", "$1", "model_name", "(.+)")))

      # Siblings of the C3 contract rows, named the same way, for the two other
      # latency panels this dashboard adds. Additive: ADR 0001 C3 lists the quantile
      # aliases as "to be added with the latency panels", and shipping only TTFT
      # would leave two panels with a raw expression and no neutral name.
      - record: llm:time_per_output_token_seconds:p50
        expr: >-
          histogram_quantile(0.50, sum by (le, job, instance, model) (label_replace(rate({__name__=~"llama:time_per_output_token_seconds_bucket|llamacpp:time_per_output_token_seconds_bucket|llamacpp:time_per_token_seconds_bucket|vllm:time_per_output_token_seconds_bucket"}[5m]), "model", "$1", "model_name", "(.+)")))

      - record: llm:time_per_output_token_seconds:p90
        expr: >-
          histogram_quantile(0.90, sum by (le, job, instance, model) (label_replace(rate({__name__=~"llama:time_per_output_token_seconds_bucket|llamacpp:time_per_output_token_seconds_bucket|llamacpp:time_per_token_seconds_bucket|vllm:time_per_output_token_seconds_bucket"}[5m]), "model", "$1", "model_name", "(.+)")))

      - record: llm:time_per_output_token_seconds:p99
        expr: >-
          histogram_quantile(0.99, sum by (le, job, instance, model) (label_replace(rate({__name__=~"llama:time_per_output_token_seconds_bucket|llamacpp:time_per_output_token_seconds_bucket|llamacpp:time_per_token_seconds_bucket|vllm:time_per_output_token_seconds_bucket"}[5m]), "model", "$1", "model_name", "(.+)")))

      - record: llm:end_to_end_response_seconds:p50
        expr: >-
          histogram_quantile(0.50, sum by (le, job, instance, model) (label_replace(rate({__name__=~"llama:end_to_end_response_seconds_bucket|llamacpp:end_to_end_response_seconds_bucket|llamacpp:requests_seconds_bucket|llamacpp:request_seconds_bucket|vllm:e2e_request_latency_seconds_bucket"}[5m]), "model", "$1", "model_name", "(.+)")))

      - record: llm:end_to_end_response_seconds:p90
        expr: >-
          histogram_quantile(0.90, sum by (le, job, instance, model) (label_replace(rate({__name__=~"llama:end_to_end_response_seconds_bucket|llamacpp:end_to_end_response_seconds_bucket|llamacpp:requests_seconds_bucket|llamacpp:request_seconds_bucket|vllm:e2e_request_latency_seconds_bucket"}[5m]), "model", "$1", "model_name", "(.+)")))

      - record: llm:end_to_end_response_seconds:p99
        expr: >-
          histogram_quantile(0.99, sum by (le, job, instance, model) (label_replace(rate({__name__=~"llama:end_to_end_response_seconds_bucket|llamacpp:end_to_end_response_seconds_bucket|llamacpp:requests_seconds_bucket|llamacpp:request_seconds_bucket|vllm:e2e_request_latency_seconds_bucket"}[5m]), "model", "$1", "model_name", "(.+)")))

  # --- is the monitor actually scraping? (ADR 0001 C2/C3) --------------------
  # `llm_monitor_*` is what monitor/serve.py publishes through its /metrics
  # passthrough. These two aliases are the canonical "history is being recorded"
  # signal: a flat line in Grafana means blind, not idle, and that distinction is
  # the whole reason the passthrough publishes self-metrics at all.
  - name: llm-scrape-health
    interval: 30s
    rules:
      - record: llm:scrape_ok
        expr: min by (job, instance) (llm_monitor_scrape_ok)

      # Fraction of the last 10 minutes in which the monitor's most recent scrape
      # had succeeded. Deliberately built from the gauge, not from a success/failure
      # counter pair: the monitor counts successes (a counter Prometheus can reset
      # on restart) and records the latest outcome as a gauge, so averaging the gauge
      # is the only ratio that does not invent a counter that does not exist.
      #
      # A monitor that is up but cannot reach its upstream reads 0 here and 1 on `up`
      # -- that pair is what an operator needs: `up` says the process answers, this
      # says the scrape works.
      - record: llm:scrape_success_ratio
        expr: >-
          avg by (job, instance) (avg_over_time(llm_monitor_scrape_ok[10m]))

  # --------------------------------------------------------------------------- #
  # Windowed rollups: "average tokens/s over the last hour / day / week".
  #
  # Everything above this line is a *rate over one scrape-scale window* (5m). This
  # group is the same measurement folded over a much longer window, which is the
  # question the dashboard is actually asked out loud: how fast was this box
  # yesterday, how many tokens did it decode last week, was the cache warm
  # overnight. Without these rows every such question is re-derived in the browser
  # from the raw counters on every panel refresh, and a panel that asks for a week
  # of history pays for a week of samples each time it redraws.
  #
  # Two sources, deliberately:
  #
  #   * `avg/max_over_time(llm:<alias>[w])` reads the *recorded* 5m aliases above,
  #     never the raw counters. One series per window per (job, instance, model),
  #     and the vendor-name union is already resolved there, so nothing here has to
  #     know a vendor. Windows of a day or less read every 30s sample (2 880 of
  #     them: cheap and exact). The 7d window reads a 10m-step subquery instead of
  #     20 160 samples — the same bounded-read choice `host:gtt_usage_ratio:max_2d`
  #     makes with `[2d:15m]`, and it costs a little sampling noise on a window
  #     whose meaningful variation is measured in hours.
  #
  #   * `increase()` over the raw counters for the totals, because a total is the
  #     one thing a mean cannot give you ("tokens decoded yesterday", not "the
  #     average rate yesterday"). increase() also handles counter resets, which is
  #     what makes these restart-safe where the lifetime ratio on the Overview row
  #     is not.
  #
  # WINDOW SEMANTICS, because a mean over a window is not one number:
  #   * Windows are relative to *now* (the evaluation time), and are re-evaluated
  #     every `interval` below, so a panel can plot a series that is itself a
  #     rolling mean — the history of the average, not just the average.
  #   * `avg_over_time` averages the samples that EXIST. A server that was down (or
  #     unscraped) for six hours of a 24h window contributes nothing to the mean,
  #     so these read "mean throughput while it was up", which is the useful
  #     meaning: a mean that counted downtime as zero would say the box got slower.
  #     `llm:scrape_success_ratio:mean_24h` beside it is how you tell the two apart.
  #   * `:mean_` on a ratio (cache hit, draft acceptance) is the token-weighted mean
  #     over the window — increases divided by increases — not the arithmetic mean of
  #     the five-minute ratios. Long-tailed bursts weight a pooled mean correctly;
  #     a mean-of-means would not.
  #
  # Naming follows the file's existing `measure:aggregation_window` form
  # (`host:gtt_usage_ratio:max_2d`): `llm:decode_tokens_per_second:mean_1h`.
  # A window here longer than `PROMETHEUS_RETENTION_TIME` silently answers from a
  # partial window, so `check_monitoring.py` compares the longest window in this
  # file (and in the dashboard) against the retention the compose file defaults to.
  #
  # Cost: 15 rules, one series each per (job, instance, model). Two model servers
  # labelled => 30 series written every 5m = 8 640 samples/day ≈ 13 kB/day
  # compressed, against ~37 MB/day for the raw scrape (monitoring/README.md
  # "Retention sizing"). Rollups are the cheap half of the history budget.
  # --------------------------------------------------------------------------- #
  - name: llm-rollups
    interval: 5m
    rules:
      # --- decode throughput, folded ----------------------------------------- #
      - record: llm:decode_tokens_per_second:mean_1h
        expr: >-
          avg_over_time(llm:decode_tokens_per_second[1h])

      - record: llm:decode_tokens_per_second:mean_24h
        expr: >-
          avg_over_time(llm:decode_tokens_per_second[24h])

      # Sampled at a 10m step rather than every 30s sample: see this group's header.
      - record: llm:decode_tokens_per_second:mean_7d
        expr: >-
          avg_over_time(llm:decode_tokens_per_second[7d:10m])

      # Peak, not mean: "how fast did this box ever go yesterday" is the number a
      # capacity decision needs, and a mean cannot answer it.
      - record: llm:decode_tokens_per_second:max_24h
        expr: >-
          max_over_time(llm:decode_tokens_per_second[24h])

      # --- prompt (prefill) and request rates, folded ------------------------ #
      - record: llm:prompt_tokens_per_second:mean_24h
        expr: >-
          avg_over_time(llm:prompt_tokens_per_second[24h])

      - record: llm:requests_per_second:mean_24h
        expr: >-
          avg_over_time(llm:requests_per_second[24h])

      # --- totals over a window (the "how much work" numbers) ---------------- #
      # increase(), not a mean: these answer "how many tokens / requests in the
      # last day", which no rate can. Same vendor-name unions as the aliases above,
      # same label normalization, same clamp-free shape (a total has no denominator).
      - record: llm:decoded_tokens:sum_1h
        expr: >-
          sum by (job, instance, model) (label_replace(increase({__name__=~"llamacpp:tokens_predicted_total|llamacpp:predicted_tokens_total|vllm:generation_tokens_total"}[1h]), "model", "$1", "model_name", "(.+)"))

      - record: llm:decoded_tokens:sum_24h
        expr: >-
          sum by (job, instance, model) (label_replace(increase({__name__=~"llamacpp:tokens_predicted_total|llamacpp:predicted_tokens_total|vllm:generation_tokens_total"}[24h]), "model", "$1", "model_name", "(.+)"))

      - record: llm:decoded_tokens:sum_7d
        expr: >-
          sum by (job, instance, model) (label_replace(increase({__name__=~"llamacpp:tokens_predicted_total|llamacpp:predicted_tokens_total|vllm:generation_tokens_total"}[7d]), "model", "$1", "model_name", "(.+)"))

      - record: llm:prompt_tokens_processed:sum_24h
        expr: >-
          sum by (job, instance, model) (label_replace(increase({__name__=~"llamacpp:prompt_tokens_total|vllm:prompt_tokens_total"}[24h]), "model", "$1", "model_name", "(.+)"))

      - record: llm:requests_completed:sum_24h
        expr: >-
          sum by (job, instance, model) (label_replace(increase({__name__=~"halogen:requests_total|llamacpp:requests_total|vllm:request_success_total"}[24h]), "model", "$1", "model_name", "(.+)"))

      # --- ratios, pooled over the window ----------------------------------- #
      - record: llm:prompt_cache_hit_ratio:mean_24h
        expr: >-
          sum by (job, instance, model) (label_replace(increase({__name__=~"halogen:prompt_tokens_cached_total|llamacpp:prompt_cache_tokens_cached_total"}[24h]), "model", "$1", "model_name", "(.+)"))
          /
          clamp_min(sum by (job, instance, model) (label_replace(increase({__name__=~"llamacpp:prompt_tokens_total|vllm:prompt_tokens_total"}[24h]), "model", "$1", "model_name", "(.+)")) + sum by (job, instance, model) (label_replace(increase({__name__=~"halogen:prompt_tokens_cached_total|llamacpp:prompt_cache_tokens_cached_total"}[24h]), "model", "$1", "model_name", "(.+)")), 1)

      - record: llm:draft_acceptance_ratio:mean_24h
        expr: >-
          sum by (job, instance, model) (label_replace(increase({__name__=~"halogen:draft_tokens_accepted_total|llamacpp:draft_tokens_accepted_total"}[24h]), "model", "$1", "model_name", "(.+)"))
          /
          clamp_min(sum by (job, instance, model) (label_replace(increase({__name__=~"halogen:draft_tokens_total|llamacpp:draft_tokens_total"}[24h]), "model", "$1", "model_name", "(.+)")), 1)

      # "Was the KV pool the limit overnight?" The max over a day, so a 30-second
      # saturation that a 24h mean smooths into nothing still shows up here.
      - record: llm:kv_cache_usage_ratio:max_24h
        expr: >-
          max_over_time(llm:kv_cache_usage_ratio[24h])

      # Trust in the history itself: the fraction of the last day in which the
      # monitor's scrape had succeeded. A flat line in Grafana is either an idle
      # server or a blind monitor, and this is the series that says which.
      - record: llm:scrape_success_ratio:mean_24h
        expr: >-
          avg_over_time(llm:scrape_success_ratio[24h])

  # --- host + GPU baselines (workspace-szw.13) ------------------------------
  # The rule this repo follows for a new alert is *measure first*, and the ticket
  # said so explicitly: a GTT threshold guessed on deploy day is an alert that
  # either never fires or pages at 02:00, because nobody can know this box's
  # steady-state GTT without watching it work. So the baseline is recorded from
  # the first scrape onward, in Prometheus, rather than in a notebook:
  #
  #   promtool query instant http://127.0.0.1:9090 'host:gtt_usage_ratio:max_2d'
  #
  # after two days is the number `GTT_PRESSURE_WARN` in alert_thresholds.env is
  # meant to be set from (and `monitoring/collect_host_baseline.sh` prints the
  # whole set). The `:max_2d` / `:mean_2d` suffixes follow the Prometheus
  # convention the latency quantiles above use.
  #
  # Cost: five series written every 5 minutes, each 2-day window read at a 15m
  # subquery step (192 points per series per evaluation) — the reason the step is
  # 15m and not 1m is exactly this file's own footprint rule: measure before you
  # multiply.
  #
  # These are `host:*`, not `llm:*`: the C3 contract is about the vendor-drift
  # seam for model-server metrics, and nothing here has a vendor spelling.
  - name: host-baselines
    interval: 5m
    rules:
      # GTT as a fraction of the box's whole GTT budget (amdgpu.gttsize), i.e.
      # the same ratio NodeGttPressureHigh alerts on and the GPU & host row
      # plots. One series per card.
      - record: host:gtt_usage_ratio
        expr: >-
          node_drm_memory_gtt_used_bytes / node_drm_memory_gtt_size_bytes

      - record: host:gtt_usage_ratio:max_2d
        expr: >-
          max_over_time(host:gtt_usage_ratio[2d:15m])

      - record: host:gtt_usage_ratio:mean_2d
        expr: >-
          avg_over_time(host:gtt_usage_ratio[2d:15m])

      # Memory PSI as a stall fraction (the same shape NodeMemoryPressure* read),
      # and the GPU's hottest sensor, so a thermal threshold can be set from what
      # the box actually reaches rather than from the part's absolute maximum.
      - record: host:psi_memory_waiting_ratio
        expr: >-
          rate(node_pressure_memory_waiting_seconds_total[5m])

      - record: host:psi_memory_waiting_ratio:max_2d
        expr: >-
          max_over_time(host:psi_memory_waiting_ratio[2d:15m])

      - record: host:gpu_temp_celsius:max_2d
        expr: >-
          max_over_time(node_hwmon_temp_celsius{chip="amdgpu"}[2d:15m])
