on: push

jobs:
  run_ui_tests:
    name: Run UI tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.1.0"
      - name: run tests
        run: node --test "monitor/tests/*.test.mjs"

  run_server_tests:
    name: Run server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.1.0"
      - name: run server tests
        run: |
            python3 -m unittest discover -s monitor/tests -p "test_*.py"   # the proxy

  # The monitoring stack is configuration, and configuration rots silently: a rule
  # file that stopped parsing, a dashboard regenerated by hand, a target list that
  # drifted from .env. All of that is checked here rather than discovered by a
  # panel saying "No data" a week later. Nothing in this job needs the GPU box.
  monitoring:
    name: Validate monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pinned Prometheus version
        id: prom
        # Same major/minor as the pinned image, so the parser checking the queries is
        # the parser that will run them. Picked out of compose.yaml rather than
        # duplicated here: one place says the version.
        run: |
          tag=$(grep -oE 'prom/prometheus:v[0-9]+\.[0-9]+\.[0-9]+' monitoring/compose.yaml | head -1 | cut -d: -f2)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install promtool ${steps.prom.outputs.version}
        run: |
          set -euo pipefail
          v=${{ steps.prom.outputs.version }}
          curl -fsSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${v}/prometheus-${v}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /tmp
          echo "/tmp/prometheus-${v}.linux-amd64" >> "$GITHUB_PATH"

      - name: Generated files are committed, not stale
        run: |
          set -euo pipefail
          # rules.yml is the render of rules.yml.tmpl + alert_thresholds.env, and
          # llm-server.json is the render of make_dashboard.py. Both are committed so
          # `docker compose up` stays a single command; both are re-rendered here so a
          # commit that edits one side of the pair fails instead.
          python3 monitoring/render_rules.py --check
          python3 monitoring/grafana/make_dashboard.py
          git diff --exit-code monitoring/grafana/dashboards/llm-server.json || {
            echo "::error::dashboards/llm-server.json is stale — run: python3 monitoring/grafana/make_dashboard.py"
            exit 1
          }

      - name: Structure and cross-file checks
        run: python3 monitoring/check_monitoring.py --promtool

      - name: promtool — config, rules, alert unit tests
        run: |
          set -euo pipefail
          promtool check config monitoring/prometheus/prometheus.yml
          promtool check rules monitoring/prometheus/rules.yml monitoring/prometheus/recording_rules.yml
          promtool test rules monitoring/prometheus/unit-tests.yml

      - name: compose config is valid
        # ubuntu-latest ships with the compose plugin; a broken service block should
        # fail here and not on the box at 02:00. Reads the same file the box reads, so
        # it needs a placeholder admin password (compose refuses to start without one).
        run: |
          set -euo pipefail
          cp monitoring/.env.example monitoring/.env
          GRAFANA_ADMIN_PASSWORD=ci-only-not-a-secret \
            docker compose -f monitoring/compose.yaml config -q

      - name: Grafana would accept the provisioned dashboard
        # Grafana's own schema check is not available without running it, but the two
        # structural things that break provisioning are checked by
        # check_monitoring.py above; this is the cheap JSON sanity gate.
        run: python3 -c "import json;json.load(open('monitoring/grafana/dashboards/llm-server.json'))"
