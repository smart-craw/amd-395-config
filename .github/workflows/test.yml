on: push

jobs:
  run_ui_tests:
    name: Run UI tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.1.0"
      - name: run tests
        run: node --test "monitor/tests/*.test.mjs"

  run_server_tests:
    name: Run server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.1.0"
      - name: run server tests
        run: |
            python3 -m unittest discover -s monitor/tests -p "test_*.py"   # the proxy

  # The monitoring stack is configuration, and configuration rots silently: a rule
  # file that stopped parsing, a dashboard regenerated by hand, a target list that
  # drifted from .env. All of that is checked here rather than discovered by a
  # panel saying "No data" a week later. Nothing in this job needs the GPU box.
  monitoring:
    name: Validate monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pinned Prometheus version
        id: prom
        # Same major/minor as the pinned image, so the parser checking the queries is
        # the parser that will run them. Picked out of compose.yaml rather than
        # duplicated here: one place says the version.
        run: |
          tag=$(grep -oE 'prom/prometheus:v[0-9]+\.[0-9]+\.[0-9]+' monitoring/compose.yaml | head -1 | cut -d: -f2)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install promtool ${steps.prom.outputs.version}
        run: |
          set -euo pipefail
          v=${{ steps.prom.outputs.version }}
          curl -fsSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${v}/prometheus-${v}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /tmp
          echo "/tmp/prometheus-${v}.linux-amd64" >> "$GITHUB_PATH"

      - name: Generated files are committed, not stale
        run: |
          set -euo pipefail
          # rules.yml is the render of rules.yml.tmpl + alert_thresholds.env, and
          # llm-server.json is the render of make_dashboard.py. Both are committed so
          # `docker compose up` stays a single command; both are re-rendered here so a
          # commit that edits one side of the pair fails instead.
          python3 monitoring/render_rules.py --check
          python3 monitoring/grafana/make_dashboard.py
          git diff --exit-code monitoring/grafana/dashboards/llm-server.json || {
            echo "::error::dashboards/llm-server.json is stale — run: python3 monitoring/grafana/make_dashboard.py"
            exit 1
          }

      - name: Structure and cross-file checks
        run: python3 monitoring/check_monitoring.py --promtool

      # The AMD GPU spike's sysfs reader is stdlib-only and ships a fixture, so its
      # "an unreadable attribute is absent, never zero" rule stays enforced rather
      # than becoming folklore. Needs no GPU and no network.
      - name: GPU spike — sysfs reader tests
        run: python3 -m unittest discover -s spikes/amd-gpu-metrics -p "test_*.py"

      - name: promtool — config, rules, alert unit tests
        run: |
          set -euo pipefail
          promtool check config monitoring/prometheus/prometheus.yml
          promtool check rules monitoring/prometheus/rules.yml monitoring/prometheus/recording_rules.yml
          promtool test rules monitoring/prometheus/unit-tests.yml

      - name: compose config is valid
        # ubuntu-latest ships with the compose plugin; a broken service block should
        # fail here and not on the box at 02:00. Reads the same file the box reads, so
        # it needs a placeholder admin password (compose refuses to start without one).
        run: |
          set -euo pipefail
          cp monitoring/.env.example monitoring/.env
          GRAFANA_ADMIN_PASSWORD=ci-only-not-a-secret \
            docker compose -f monitoring/compose.yaml config -q

      - name: the opt-in LAN override merges the way the docs say
        # compose *appends* sequences, so compose.lan.yaml's grafana `ports` is
        # tagged `!override` (compose-go >= 2.14) to REPLACE the base loopback
        # mapping instead of joining it. Untagged or unsupported, the runner would
        # resolve two mappings for host port 3000 — which on the box is not a
        # warning but a container that dies with "address already in use". The rest
        # is the same invariant the runbook sells: prometheus stays on loopback even
        # when grafana does not.
        run: |
          set -euo pipefail
          GRAFANA_ADMIN_PASSWORD=ci-only-not-a-secret \
            docker compose -f monitoring/compose.yaml \
                       -f monitoring/compose.lan.yaml config --format json \
          | python3 -c '
          import json, sys
          cfg = json.load(sys.stdin)["services"]
          graf = cfg["grafana"].get("ports") or []
          prom = cfg["prometheus"].get("ports") or []
          assert len(graf) == 1, (
              f"grafana resolved {len(graf)} published ports: the !override tag on "
              "compose.lan.yaml ports did not replace the base mapping "
              "(needs docker compose >= 2.14)")
          hip = graf[0].get("host_ip") if graf else None
          assert hip in (None, "", "0.0.0.0"), (
              f"the LAN override bound grafana to {hip!r}, which exposes nothing")
          assert len(prom) == 1 and prom[0].get("host_ip") == "127.0.0.1", (
              "prometheus must stay loopback-bound even with the LAN override: "
              "Grafana reads it through the datasource proxy")
          print("LAN override merges as documented")
          '

      # monitoring/PARITY.md is a measurement, so the thing that measures it is tested
      # like code: the parity harness models the bespoke page in Python, and this is
      # the half of that model that needs neither Prometheus nor a model server. (The
      # other half — that the model still matches the real page — is enforced by
      # monitor/tests/test_parity_oracle.test.mjs in the UI job.)
      - name: parity harness - page-side model still matches its fixtures
        run: python3 monitoring/parity/parity_check.py selftest

      # monitoring/PARITY.md is generated from a run's artifacts by
      # fill_parity_doc.py, which refuses to leave a placeholder unfilled. This is the
      # same check in CI: a document quoting numbers it did not read from the run it
      # cites is worse than no document, and a half-filled table is how that happens.
      - name: PARITY.md is fully generated (no unfilled placeholders)
        run: |
          set -euo pipefail
          if grep -n -o '{{[A-Z_]*}}' monitoring/PARITY.md; then
            echo "::error::monitoring/PARITY.md contains unfilled placeholders;" \
                 "re-run: python3 monitoring/parity/fill_parity_doc.py <run-dir>"
            exit 1
          fi

      - name: Grafana would accept the provisioned dashboard
        # Grafana's own schema check is not available without running it, but the two
        # structural things that break provisioning are checked by
        # check_monitoring.py above; this is the cheap JSON sanity gate.
        run: python3 -c "import json;json.load(open('monitoring/grafana/dashboards/llm-server.json'))"
